# Lint and test every push and pull request. Build the arm64 image for the phone:
#   push to main -> ghcr.io/scyurii/invest-analytics-bot:edge (the phone ignores it)
#   tag vX.Y.Z   -> :X.Y.Z and :stable, signed with cosign, GitHub release;
#                   the phone installs it by itself (deploy/update.sh)
name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/scyurii/invest-analytics-bot

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: shellcheck -s sh deploy/*.sh

  image:
    needs: test
    if: github.event_name == 'push'
    # Native arm64: the phone is aarch64, no emulation needed
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write        # the GitHub release
      packages: write        # push to ghcr.io
      id-token: write        # keyless cosign signature
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v4.1.2   # no major-version tag upstream
      - name: Sign the release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "Image: \`$IMAGE@$DIGEST\` (linux/arm64, signed with cosign)"
